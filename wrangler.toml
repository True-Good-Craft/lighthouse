name = "buscore-lighthouse"
account_id = "eb1a8dd5723031d94e57642e3eaaebda"
main = "src/index.ts"
compatibility_date = "2026-02-26"
compatibility_flags = ["global_fetch_strictly_public"]

[vars]
# Phase 2 (optional). Code defaults to True-Good-Craft/TGC-BUS-Core if unset.
# GITHUB_TOKEN is a secret (set via `wrangler secret put GITHUB_TOKEN`), not a var.
GITHUB_REPO = "True-Good-Craft/TGC-BUS-Core"

[[d1_databases]]
binding = "DB"
database_name = "lighthouse"
database_id = "e46f2daa-7e97-45a3-9bf0-49003a42850c"

[[d1_databases]]
binding = "BUSCORE_LEADS_DB"
database_name = "buscore-leads"
database_id = "75c09145-ce89-418c-b0f0-92afa2835bfd"

[[r2_buckets]]
binding = "MANIFEST_R2"
bucket_name = "bus-core"

[triggers]
crons = ["5 0 * * *"]
